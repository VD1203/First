    <text class="m dq" x="588" y="88"  font-size="15">EQ · EX-US · HEDGED 40%</text>
    <text class="n d"  x="588" y="330" font-size="54">12.8%</text>
    <text class="m d"  x="964" y="330" font-size="22" text-anchor="end">+3.1</text>
