<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>Sector exposure map — 15 sleeves sized by portfolio weight, coloured by trailing quarter return</title>

  <defs>
    <style>
      .n { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: -0.01em; }
      .m { font-family: Menlo, Monaco, "Courier New", monospace; font-weight: 400; letter-spacing: 0.06em; }
      .d  { fill: #F2F4F3; }        /* text on dark tiles  */
      .l  { fill: #14181B; }        /* text on light tiles */
      .dq { fill: #F2F4F3; fill-opacity: .62; }
      .lq { fill: #14181B; fill-opacity: .55; }
    </style>
  </defs>

  <!-- grout -->
  <rect width="1600" height="1000" fill="#0A0C10"/>

  <!-- ── column A ─────────────────────────────────────────── -->
  <g>
    <rect x="4"   y="4"   width="552" height="512" fill="#2E9078"/>
    <text class="n d"  x="32" y="60"  font-size="34">US Large Cap</text>
    <text class="m dq" x="32" y="90"  font-size="17">EQ · CORE · 412 HOLDINGS</text>
    <text class="n d"  x="32" y="486" font-size="72">22.0%</text>
    <text class="m d"  x="524" y="486" font-size="26" text-anchor="end">+2.4</text>
  </g>
  <g>
    <rect x="4"   y="524" width="272" height="472" fill="#D3937C"/>
    <text class="n l"  x="28" y="56"  font-size="24" transform="translate(0,524)">US Small Cap</text>
    <text class="m lq" x="28" y="82"  font-size="14" transform="translate(0,524)">EQ · SATELLITE</text>
    <text class="n l"  x="28" y="446" font-size="46" transform="translate(0,524)">5.1%</text>
    <text class="m l"  x="248" y="446" font-size="20" text-anchor="end" transform="translate(0,524)">−1.2</text>
  </g>
  <g>
    <rect x="284" y="524" width="272" height="472" fill="#8AC4B2"/>
    <text class="n l"  x="308" y="580" font-size="24">US Mid Cap</text>
    <text class="m lq" x="308" y="606" font-size="14">EQ · SATELLITE</text>
    <text class="n l"  x="308" y="970" font-size="46">4.4%</text>
    <text class="m l"  x="528" y="970" font-size="20" text-anchor="end">+0.8</text>
  </g>

  <!-- ── column B ─────────────────────────────────────────── -->
